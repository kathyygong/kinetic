name: Windows integration

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mobile-checkin-contract
      - codex/mobile-pattern-results
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend, backend, and Firestore gates
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: kinetic-ci.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: kinetic-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: kinetic-ci.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-app
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run connected dependency audit
        working-directory: frontend
        run: npm run beta:audit

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend TypeScript checks
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run deterministic frontend smoke suite
        working-directory: frontend
        run: npm run smoke

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Run beta readiness
        working-directory: frontend
        run: npm run beta:readiness

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        working-directory: backend
        run: python -m compileall app evals

      - name: Run backend deterministic gates and verify eval report
        working-directory: backend
        run: python -m evals.generate_report --check

      - name: Run AI product eval journeys
        working-directory: backend
        run: python -m evals.run_product_evals --check

      - name: Verify model-quality datasets and graders
        working-directory: backend
        run: python -m evals.model_quality_smoke

      - name: Run backend smoke suite
        working-directory: backend
        run: python -m evals._smoke

      - name: Run owner-only Firestore rules suite
        run: npx firebase-tools emulators:exec --only auth,firestore "cd frontend && npm run test:firestore-rules"
